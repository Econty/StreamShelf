name: Windows build and tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Configure
        run: cmake --preset release
      - name: Build
        run: cmake --build --preset release --parallel 2
      - name: Test
        run: ctest --preset release
      - name: Install
        run: cmake --install build/release --prefix build/package
