name: Windows build and tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install integration test tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install yt-dlp==2026.10.26
          if ($LASTEXITCODE -ne 0) { throw 'Could not install yt-dlp' }
          choco install ffmpeg --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw 'Could not install FFmpeg' }
          $toolDir = Join-Path $env:RUNNER_TEMP 'streamshelf-test-tools'
          New-Item -ItemType Directory -Force -Path $toolDir | Out-Null
          $ffmpeg = Get-ChildItem -Path (Join-Path $env:ChocolateyInstall 'lib/ffmpeg/tools') -Filter ffmpeg.exe -Recurse -File | Select-Object -First 1
          if (-not $ffmpeg) { throw 'FFmpeg executable not found in Chocolatey package' }
          $ffprobe = Join-Path $ffmpeg.DirectoryName 'ffprobe.exe'
          if (-not (Test-Path -LiteralPath $ffprobe -PathType Leaf)) { throw 'FFprobe executable not found' }
          Copy-Item -LiteralPath $ffmpeg.FullName, $ffprobe -Destination $toolDir
          $scripts = python -c "import sysconfig; print(sysconfig.get_path('scripts'))"
          Copy-Item -LiteralPath (Join-Path $scripts 'yt-dlp.exe') -Destination $toolDir
          "STREAMSHELF_TEST_TOOLS=$toolDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Configure beta without signed Firefox connector
        if: ${{ hashFiles('extension/firefox-signed/StreamShelf-Connector-1.0.5.xpi') == '' }}
        run: cmake --preset release -DSTREAMSHELF_BETA_WITHOUT_FIREFOX=ON
      - name: Configure full release with signed Firefox connector
        if: ${{ hashFiles('extension/firefox-signed/StreamShelf-Connector-1.0.5.xpi') != '' }}
        run: cmake --preset release -DSTREAMSHELF_BETA_WITHOUT_FIREFOX=OFF
      - name: Build
        run: cmake --build --preset release --parallel 2
      - name: Test
        run: ctest --preset release
      - name: Install beta without signed Firefox connector
        if: ${{ hashFiles('extension/firefox-signed/StreamShelf-Connector-1.0.5.xpi') == '' }}
        run: cmake --install build/release --prefix build/package
      - name: Install full release with signed Firefox connector
        if: ${{ hashFiles('extension/firefox-signed/StreamShelf-Connector-1.0.5.xpi') != '' }}
        run: cmake --install build/release --prefix build/package
      - name: Check beta package notice and Firefox exclusion
        if: ${{ hashFiles('extension/firefox-signed/StreamShelf-Connector-1.0.5.xpi') == '' }}
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath 'build/package/BETA-FIREFOX-UNAVAILABLE.md' -PathType Leaf)) {
            throw 'The beta package is missing its Firefox availability notice'
          }
          if (Test-Path -LiteralPath 'build/package/extensions/firefox-signed') {
            throw 'The incomplete beta package includes a Firefox signing package'
          }
      - name: Check signed Firefox connector is present in full release
        if: ${{ hashFiles('extension/firefox-signed/StreamShelf-Connector-1.0.5.xpi') != '' }}
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath 'build/package/extensions/firefox-signed/StreamShelf-Connector-1.0.5.xpi' -PathType Leaf)) {
            throw 'The full release is missing its signed Firefox connector'
          }
      - name: Check full release still requires a signed Firefox connector
        if: ${{ hashFiles('extension/firefox-signed/StreamShelf-Connector-1.0.5.xpi') == '' }}
        shell: pwsh
        run: |
          cmake -S . -B build/release-guard -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DSTREAMSHELF_BETA_WITHOUT_FIREFOX=OFF
          if ($LASTEXITCODE -ne 0) { throw 'Could not configure the full release guard check' }
          $ErrorActionPreference = 'Continue'
          $output = & cmake --install build/release-guard --prefix build/release-guard-package 2>&1 | Out-String
          $installExit = $LASTEXITCODE
          $ErrorActionPreference = 'Stop'
          if ($installExit -eq 0 -or $output -notmatch '(?s)Release install requires the current Mozilla-signed Firefox\s+connector') {
            Write-Host $output
            throw 'A full release did not reject the missing Firefox connector as expected'
          }
